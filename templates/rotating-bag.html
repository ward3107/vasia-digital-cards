<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#1243ce">{{CANONICAL_META}}
<meta property="og:type" content="website"><meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
{{OG_URL_META}}{{OG_IMAGE_META}}<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="{{BAG_ALT}}">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="/shared/card.css"></head><body><svg xmlns="http://www.w3.org/2000/svg" class="symbol-bank" aria-hidden="true"><defs>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a16 16 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2C10 21 3 14 3 5a2 2 0 0 1 2-2Z"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-13 8L3 21l1.5-5A9 9 0 1 1 21 11.5Z"/><path d="m8 7 1.5 3-1 1c1 2 2 3 4 4l1-1 3 1.5c-.5 2-2 2-3 1.5-4-1-7-4-8-8-.5-1 0-2 2-2Z" stroke-width="1.2"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-shop" viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6M3 10a3 3 0 0 0 5 2 3 3 0 0 0 4 0 3 3 0 0 0 4 0 3 3 0 0 0 5-2M9 20v-6h6v6"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M7 10H4v11h16V10h-3"/></symbol>
<symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h3v3h3v3h-6v-3m6-6v3M12 3v2m0 7v2m0 7v-3M3 12h4m5-3v3h4"/></symbol>
<symbol id="i-access" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="m4 8 8 2 8-2M12 10v5m-4 6 4-6 4 6"/></symbol>
<symbol id="i-waze" viewBox="0 0 24 24"><path d="M20.5 10.5a8 8 0 0 1-8 8H7l-4 2 1.5-5A8 8 0 1 1 20.5 10.5Z"/><circle cx="8" cy="20" r="1.6"/><circle cx="16" cy="20" r="1.6"/><path d="M8 12c2 3 5 3 7 0M8 8h.1M15 8h.1"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a20 20 0 0 1 0 18 20 20 0 0 1 0-18Z"/></symbol></defs></svg>
<main class="screen" id="screen">
<header class="topbar"><button class="icon-button" data-open="access-dialog" data-label="access" aria-label="access"><svg class="icon" aria-hidden="true"><use href="#i-access"/></svg><span class="tip" data-t="access"></span></button><h1 class="brand"><img src="./assets/logo.png" width="160" height="57" alt="{{NAME}}"><span class="sr-only">{{TITLE}}</span></h1><button class="icon-button" data-open="language-dialog" data-label="language" aria-label="language"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg><span class="tip" data-t="language"></span></button></header>
<section class="stage" aria-label="{{BAG_ALT}}"><div class="halo"></div><div class="bag-shadow"></div><div class="bag-rig" id="bag-rig" role="img" aria-label="{{BAG_ALT}}"><div class="face front"><div class="face-copy"><span class="bag-name">{{NAME}}</span><span class="bag-tagline">{{TAGLINE}}</span><i class="bag-divider"></i><span class="bag-details">{{BAG_DETAILS}}</span><span class="bag-phone">{{PHONE_DISPLAY}}</span></div></div><div class="face back"><div class="face-copy"><span class="bag-name">{{NAME}}</span><span class="bag-tagline">{{TAGLINE}}</span><i class="bag-divider"></i><span class="bag-details">{{BAG_DETAILS}}</span><span class="bag-phone">{{PHONE_DISPLAY}}</span></div></div><svg class="bag-handle handle-front" viewBox="0 0 110 100" aria-hidden="true"><path class="dark" d="M12 92V58C12-8 98-8 98 58v34"/><path d="M12 92V58C12-8 98-8 98 58v34"/></svg><svg class="bag-handle handle-back" viewBox="0 0 110 100" aria-hidden="true"><path class="dark" d="M12 92V58C12-8 98-8 98 58v34"/><path d="M12 92V58C12-8 98-8 98 58v34"/></svg><div class="face side left"></div><div class="face side right"></div><div class="face top"></div><div class="face bottom"></div></div><button class="icon-button motion-control" id="motion-toggle" data-label="pause" aria-label="עצירת הסיבוב" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg></button></section>
<nav class="actions" aria-label="יצירת קשר">
<a class="action whatsapp" href="https://wa.me/{{WHATSAPP}}" target="_blank" rel="noopener noreferrer" data-label="whatsapp" aria-label="whatsapp"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span class="tip" data-t="whatsapp"></span></a>
<button class="action " data-open="phone-dialog" data-label="call" aria-label="call"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><span class="tip" data-t="call"></span></button>
<a class="action " href="mailto:{{EMAIL}}" data-label="email" aria-label="email"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg><span class="tip" data-t="email"></span></a>
<a class="action " href="{{WEBSITE}}" target="_blank" rel="noopener noreferrer" data-label="shop" aria-label="shop"><svg class="icon" aria-hidden="true"><use href="#i-shop"/></svg><span class="tip" data-t="shop"></span></a>
<a class="action " href="{{MAPS_URL}}" target="_blank" rel="noopener noreferrer" data-label="navigate" aria-label="navigate"><svg class="icon" aria-hidden="true"><use href="#i-waze"/></svg><span class="tip" data-t="navigate"></span></a>
<a class="action " href="./contact.vcf" download="{{NAME}}.vcf" data-label="save" aria-label="save"><svg class="icon" aria-hidden="true"><use href="#i-save"/></svg><span class="tip" data-t="save"></span></a>
<button class="action" id="share-button" data-label="share" aria-label="share"><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg><span class="tip" data-t="share"></span></button><button class="action" data-open="qr-dialog" data-label="qr" aria-label="qr"><svg class="icon" aria-hidden="true"><use href="#i-qr"/></svg><span class="tip" data-t="qr"></span></button><button class="action" data-open="install-dialog" data-label="installShort" aria-label="installShort"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span class="tip" data-t="installShort"></span></button></nav><a class="credit" data-label="creditSite" href="https://vasia.dev/" target="_blank" rel="noopener noreferrer" aria-label="עיצוב ופיתוח VASIA — פתיחת האתר"><span data-t="credit">עיצוב ופיתוח</span><img src="/shared/vasia-logo-light.svg" alt="VASIA" width="68" height="20"></a>
</main>
<dialog id="phone-dialog" aria-labelledby="phone-title"><button class="close" data-close data-label="close" aria-label="סגירה">×</button><h2 id="phone-title" data-t="callTitle"></h2>{{PHONE_ROWS}}</dialog>
<dialog id="language-dialog" aria-labelledby="language-title"><button class="close" data-close data-label="close" aria-label="סגירה">×</button><h2 id="language-title" data-t="language">בחירת שפה</h2><div class="language-options"><button data-language="he" lang="he" aria-pressed="true">עברית</button><button data-language="ar" lang="ar" aria-pressed="false">العربية</button><button data-language="en" lang="en" aria-pressed="false">English</button></div></dialog>
<dialog id="qr-dialog" aria-labelledby="qr-title"><button class="close" data-close data-label="close" aria-label="סגירה">×</button><h2 id="qr-title" data-t="qrTitle"></h2><p data-t="qrInfo"></p><img class="qr-image" src="{{QR_ASSET}}" width="235" height="235" alt="QR"><a class="qr-link" href="{{PUBLIC_URL}}">{{PUBLIC_URL}}</a><a class="primary" href="{{QR_ASSET}}" download="{{NAME}}-QR.svg" data-t="downloadQr"></a></dialog>
<dialog id="install-dialog" aria-labelledby="install-title"><button class="close" data-close data-label="close" aria-label="סגירה">×</button><div class="install-brand"><img src="./assets/icon-192.png" width="58" height="58" alt=""><strong>{{NAME}}</strong></div><h2 id="install-title" data-t="installTitle"></h2><p id="install-status" role="status" data-t="installIntro"></p><button class="primary" id="install-now" data-t="installReady" hidden></button><div data-install-platform="android"><p data-t="installAndroid"></p><p data-t="installSamsung"></p><p class="install-notice" data-t="installInApp"></p></div><div data-install-platform="ios"><p data-t="installIos"></p><p class="install-notice" data-t="installInApp"></p></div><div data-install-platform="desktop"><p data-t="installDesktop"></p></div><p data-t="installLocation"></p><details class="install-other"><summary data-t="installOther"></summary><p data-install-other="android" data-t="installAndroid"></p><p data-install-other="android" data-t="installSamsung"></p><p data-install-other="ios" data-t="installIos"></p><p data-install-other="desktop" data-t="installDesktop"></p></details></dialog>
<dialog id="access-dialog" aria-labelledby="access-title"><button class="close" data-close data-label="close" aria-label="סגירה">×</button><h2 id="access-title" data-t="access"></h2><div class="access-options"><button id="font-up" data-t="fontUp"></button><button id="font-down" data-t="fontDown"></button><button data-access="contrast" aria-pressed="false" data-t="contrast"></button><button data-access="monochrome" aria-pressed="false" data-t="monochrome"></button><button data-access="invert" aria-pressed="false" data-t="invert"></button><button data-access="highlightLinks" aria-pressed="false" data-t="highlightLinks"></button><button data-access="highlightControls" aria-pressed="false" data-t="highlightControls"></button><button data-access="readableFont" aria-pressed="false" data-t="readableFont"></button><button data-access="spacing" aria-pressed="false" data-t="spacing"></button><button data-access="largeCursor" aria-pressed="false" data-t="largeCursor"></button><button data-access="focus" aria-pressed="false" data-t="focus"></button><button data-access="stopMotion" aria-pressed="false" data-t="stopMotion"></button></div><button class="access-reset" id="reset" data-t="reset"></button></dialog>
<dialog id="copy-dialog" aria-labelledby="copy-title"><button class="close" data-close data-label="close" aria-label="סגירה">×</button><h2 id="copy-title" data-t="copyTitle"></h2><p data-t="copyInfo"></p><input class="copy-field" id="copy-field" value="{{PUBLIC_URL}}" readonly aria-label="Card URL"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script id="card-config" type="application/json">{{CONFIG_JSON}}</script><script src="/shared/card.js" defer></script></body></html>
